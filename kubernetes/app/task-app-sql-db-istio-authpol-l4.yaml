apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: task-app-sql-db-istio-authpol-l4
  namespace: default
spec:
  selector:
    matchLabels:
      app: task-app-sql-db
  action: ALLOW
  rules:
    - from:
      - source:
          principals: ["cluster.local/ns/default/sa/task-app"]
      to:
        - operation:
            ports: ["3306"]
