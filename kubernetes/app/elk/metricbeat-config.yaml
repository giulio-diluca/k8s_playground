apiVersion: v1
kind: ConfigMap
metadata:
  name: task-app-metricbeat-config
data:
  metricbeat.yml: |
    metricbeat.config.modules:
      # automatic reload if you modify module settings
      path: ${path.config}/modules.d/*.yml
      reload.enabled: false

    metricbeat.modules:
        # node metrics ( host CPU, RAM, Disk, Load )
      - module: system
        period: 10s
        metricsets:
          - cpu
          - load
          - memory
          - network
          - process_summary
        process.include_top_n:
          by_cpu: 5
          by_memory: 5
        hostfs: /hostfs

      - module: kubernetes
        # containers and pods metrics ( from cAdvisor via kubelet )
        metricsets:
          - node
          - system
          - pod
          - container
          - volume
        period: 10s
        hosts: ["https://${NODE_NAME}:10250"]
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        ssl.verification_mode: "none" # kubelet certificate is self-signed from cluster

    output.elasticsearch:
      hosts: ['http://task-app-elasticsearch:9200']
