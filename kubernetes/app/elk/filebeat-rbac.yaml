apiVersion: v1
kind: ServiceAccount
metadata:
  name: task-app-filebeat
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: task-app-filebeat
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "nodes"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: task-app-filebeat
subjects:
  - kind: ServiceAccount
    name: task-app-filebeat
    namespace: default
roleRef:
  kind: ClusterRole
  name: task-app-filebeat
  apiGroup: rbac.authorization.k8s.io
