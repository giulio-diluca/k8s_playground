apiVersion: v1
kind: ConfigMap
metadata:
  name: task-app-filebeat-config
data:
  filebeat.yml: |-
    filebeat.inputs:
      - type: container
        paths:
          - /var/log/containers/*.log
        processors:
          - add_kubernetes_metadata:
              host: ${NODE_NAME}
              matchers:
                - logs_path:
                    logs_path: "/var/log/containers/"
          - decode_json_fields:
              when:
                equals:
                  kubernetes.container.name: "istio-proxy"
              fields: ["message"]
              target: "envoy"
              overwrite_keys: true
              add_error_key: false

    output.elasticsearch:
      hosts: ["http://task-app-elasticsearch:9200"]
    
    setup.kibana:
      host: "http://task-app-kibana:5601"
