apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-script
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS task_app (ID INT PRIMARY KEY AUTO_INCREMENT, Title VARCHAR(20), Description VARCHAR(50));
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: task-app-sql-db
spec:
  selector:
    matchLabels:
      app: task-app-sql-db
  template:
    metadata:
      labels:
        app: task-app-sql-db
    spec:
      containers:
        - image: mysql:latest
          name: task-app-sql-db
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "12345"
            - name: MYSQL_DATABASE
              value: "task_app"
          volumeMounts:
            - name: task-app-sql-db-persistent-storage
              mountPath: /var/lib/mysql
            - name: init-script-vol
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
      imagePullSecrets:
        - name: docker-reg-secret
      volumes:
        - name: task-app-sql-db-persistent-storage
          persistentVolumeClaim:
            claimName: task-app-sql-db-pv-claim
        - name: init-script-vol
          configMap:
            name: mysql-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: task-app-sql-db
spec:
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: task-app-sql-db