# A. Argo CD Repo Secret
apiVersion: v1
kind: Secret
metadata:
  name: gh-repo-creds
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: {{ .Values.gitRepo.url | quote }}
  username: {{ .Values.gitRepo.username | quote }}
  password: {{ .Values.gitRepo.token | quote }}
---
# B. GHCR Registry Secret
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-reg-secret
  namespace: default
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "{{ .Values.ghcr.username }}",
          "password": "{{ .Values.ghcr.password }}",
          "auth": "{{ printf "%s:%s" .Values.ghcr.username .Values.ghcr.password | b64enc }}"
        }
      }
    }
---
# C. Docker Hub Registry Secret
apiVersion: v1
kind: Secret
metadata:
  name: docker-reg-secret
  namespace: default
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "https://index.docker.io/v1/": {
          "username": "{{ .Values.dockerhub.username }}",
          "password": "{{ .Values.dockerhub.password }}",
          "auth": "{{ printf "%s:%s" .Values.dockerhub.username .Values.dockerhub.password | b64enc }}"
        }
      }
    }